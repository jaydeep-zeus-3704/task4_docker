
services:
  database:
    container_name: sql_database
    image: docker-registry-002.zeuslearning.com/zeuslearning/postgres:17-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgsql_data:/var/lib/pgsql
    restart: always


  backend:
    container_name: todoapp_backend
    image: node_backend:latest
    env_file:
      - .backend.env
    ports:
      - "5000:5000"
    depends_on:
      - database
    restart: always


  frontend:
    container_name: todoapp_frontend
    image: node_frontend:latest
    env_file:         
      - .frontend.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  pgsql_data:
