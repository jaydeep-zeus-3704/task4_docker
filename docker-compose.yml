
services:
  database:
    container_name: sql_database
    image: docker-registry-002.zeuslearning.com/zeuslearning/postgres:17-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    restart: always


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      secrets:
        - auth_token
    container_name: todoapp_backend
    env_file:
      - .backend.env
    ports:
      - "5000:5000"
    depends_on:
      - database
    restart: always


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      secrets:
        - auth_token
      args:
        - REACT_APP_BACKEND_HOST=localhost
    container_name: todoapp_frontend
    env_file:         
      - .frontend.env
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgsql_data:


secrets:
  auth_token:
    environment: TOKEN